server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stocksense}
    username: ${DB_USER:stocksense}
    password: ${DB_PASSWORD:stocksense}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt-secret: ${JWT_SECRET:change-this-development-secret-key-change-this}
  jwt-expiration-ms: 86400000
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
